name: release

# On a version tag (vX.Y.Z): publish the npm package and attach standalone binaries to the release.
# All binaries are cross-compiled on a single Linux runner (Bun cross-compiles every target), so
# there are no slow/flaky macOS runners in the release path.
# Actions are pinned to commit SHAs (supply-chain hardening); the trailing comment is the version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish-npm:
    # Only act on a real tag — a manual dispatch from a branch has no version to publish.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish to npm (skip if this version is already published)
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — skipping publish (npm versions are immutable)."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  standalone-binaries:
    # action-gh-release needs a tag; skip on branch dispatch.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Cross-compile all targets on one runner
        run: |
          set -euo pipefail
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --target=bun-"$t" --outfile=agent-lab-"$t" src/bin/agent-lab.ts
            bun build --compile --target=bun-"$t" --outfile=agent-lab-mcp-"$t" src/bin/agent-lab-mcp.ts
          done
          sha256sum agent-lab-* > SHA256SUMS.txt
      - name: Attach binaries + checksums to the release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            agent-lab-*
            SHA256SUMS.txt
