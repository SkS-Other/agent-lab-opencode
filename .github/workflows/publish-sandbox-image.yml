name: publish-sandbox-image

# Builds and publishes the Agent Lab sandbox image (opencode serve) to GitHub Container Registry.
# Multi-arch (amd64 + arm64). After the first publish, make the package public in the repo's
# Packages settings if the repository itself is public.
on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/publish-sandbox-image.yml"
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the owner for GHCR.
          images: ghcr.io/${{ github.repository_owner }}/agent-lab-opencode
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
